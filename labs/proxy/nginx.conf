worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
    access_log off;
    limit_conn_zone $binary_remote_addr zone=client_connections:1m;
    limit_req_zone $binary_remote_addr zone=client_requests:1m rate=100r/s;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 127.0.0.1:TLS_PORT ssl;
        server_name 127.0.0.1;
        ssl_certificate /lab/cert.pem;
        ssl_certificate_key /lab/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 64k;
        client_header_timeout 5s;
        client_body_timeout 5s;
        limit_conn client_connections 16;
        limit_req zone=client_requests burst=100 nodelay;
        location / {
            proxy_pass http://127.0.0.1:RUNTIME_PORT;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering on;
            proxy_read_timeout 20s;
            proxy_send_timeout 20s;
        }
    }
}
