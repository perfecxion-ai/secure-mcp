# Default values for secure-mcp.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global configuration
global:
  environment: production
  domain: example.com
  storageClass: gp3-encrypted

# Application configuration
replicaCount: 3

image:
  repository: secure-mcp-server
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets:
  - name: regcred

nameOverride: ""
fullnameOverride: ""

# Service Account
serviceAccount:
  create: true
  automount: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/secure-mcp-pod-role"
  name: ""

# Security Context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  annotations: {}
  labels: {}

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-modsecurity-crs: "true"
  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: secure-mcp-tls
      hosts:
        - api.example.com

# Resources
resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Autoscaling
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60

# Vertical Pod Autoscaler
vpa:
  enabled: false
  updateMode: "Auto"
  minAllowed:
    cpu: 250m
    memory: 256Mi
  maxAllowed:
    cpu: 4000m
    memory: 4Gi

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - secure-mcp
        topologyKey: kubernetes.io/hostname

# Topology Spread Constraints
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: secure-mcp

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2
  # maxUnavailable: 1

# Priority Class
priorityClassName: high-priority

# Health checks
livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health/startup
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

# Lifecycle hooks
lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "sleep 15"]

# Environment variables
env:
  NODE_ENV: production
  PORT: "3000"
  LOG_LEVEL: info
  LOG_FORMAT: json
  CORS_ORIGINS: "https://app.example.com,https://admin.example.com"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  JWT_ALGORITHM: RS256
  JWT_EXPIRY: 15m
  MFA_ENABLED: "true"
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"
  TRACING_ENABLED: "true"
  TRACING_SAMPLE_RATE: "0.1"

# Secrets - Use external secrets operator in production
secrets:
  create: true
  externalSecrets:
    enabled: false
    backend: vault
    path: secret/data/secure-mcp
  data:
    DB_USERNAME: mcp_user
    DB_PASSWORD: ChangeThisPassword123!
    REDIS_PASSWORD: ChangeThisRedisPassword!
    JWT_SECRET: ChangeThisJWTSecret!
    VAULT_TOKEN: ChangeThisVaultToken!

# ConfigMaps
configMaps:
  create: true

# Persistence
persistence:
  enabled: false
  storageClass: gp3-encrypted
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /data

# Network Policies
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system

# PostgreSQL subchart configuration
postgresql:
  enabled: true
  auth:
    username: mcp_user
    password: ChangeThisPassword123!
    database: mcp_db
  primary:
    persistence:
      enabled: true
      storageClass: gp3-encrypted
      size: 20Gi
    resources:
      limits:
        memory: 2Gi
        cpu: 2000m
      requests:
        memory: 512Mi
        cpu: 500m
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# Redis subchart configuration
redis:
  enabled: true
  auth:
    enabled: true
    password: ChangeThisRedisPassword!
  master:
    persistence:
      enabled: true
      storageClass: gp3-encrypted
      size: 10Gi
    resources:
      limits:
        memory: 1Gi
        cpu: 1000m
      requests:
        memory: 256Mi
        cpu: 250m
  replica:
    replicaCount: 2
    persistence:
      enabled: true
      storageClass: gp3-encrypted
      size: 10Gi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# Monitoring configuration
monitoring:
  enabled: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
  grafana:
    enabled: true
    adminPassword: ChangeThisGrafanaPassword!
    dashboards:
      enabled: true
      defaultDashboardsEnabled: true

# Service Mesh configuration (optional)
serviceMesh:
  enabled: false
  istio:
    enabled: false
    mtls:
      mode: STRICT
  linkerd:
    enabled: false

# Backup configuration
backup:
  enabled: false
  schedule: "0 2 * * *"
  retention: 30
  storageLocation: s3://backup-bucket/secure-mcp

# Tests
tests:
  enabled: true
  image: busybox:1.36.1