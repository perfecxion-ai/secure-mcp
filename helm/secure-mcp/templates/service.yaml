apiVersion: v1
kind: Service
metadata:
  name: {{ include "secure-mcp.fullname" . }}
  labels:
    {{- include "secure-mcp.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.env.METRICS_PORT }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "secure-mcp.selectorLabels" . | nindent 4 }}
  {{- if eq .Values.service.type "ClusterIP" }}
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "secure-mcp.fullname" . }}-headless
  labels:
    {{- include "secure-mcp.labels" . | nindent 4 }}
    service-type: headless
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: {{ .Values.env.PORT }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "secure-mcp.selectorLabels" . | nindent 4 }}