{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "secure-mcp.fullname" . }}
  labels:
    {{- include "secure-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.secrets.externalSecrets.enabled }}
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}