apiVersion: v2
name: secure-mcp
description: Enterprise-grade Model Context Protocol server with advanced security and scalability
type: application
version: 1.0.0
appVersion: "1.0.0"
home: https://github.com/enterprise/secure-mcp-server
icon: https://example.com/secure-mcp-icon.png
sources:
  - https://github.com/enterprise/secure-mcp-server
maintainers:
  - name: Enterprise Security Team
    email: security@example.com
  - name: Platform Engineering
    email: platform@example.com
keywords:
  - mcp
  - model-context-protocol
  - kubernetes
  - security
  - enterprise
  - websocket
  - api
dependencies:
  - name: postgresql
    version: "13.2.24"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "18.6.1"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: prometheus
    version: "25.8.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: monitoring.prometheus.enabled
  - name: grafana
    version: "7.0.17"
    repository: "https://grafana.github.io/helm-charts"
    condition: monitoring.grafana.enabled
annotations:
  artifacthub.io/category: integration
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/signKey: |
    fingerprint: 1234567890ABCDEF1234567890ABCDEF12345678
    url: https://keyserver.example.com/pks/lookup?op=get&search=0x1234567890ABCDEF