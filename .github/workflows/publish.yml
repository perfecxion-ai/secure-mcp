name: Release hold
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-hold:
    runs-on: ubuntu-24.04
    steps:
      - name: Block publication until alpha release gates are reviewed
        run: |
          echo "Automatic publication is disabled during the v2 rebuild."
          echo "CI produces verified artifacts. Release approval and provenance wiring remain separate work."
          exit 1
