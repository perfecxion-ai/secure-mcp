name: Review baseline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  review:
    name: Validate review artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - run: node scripts/verify-review.mjs
      - name: State the unsupported runtime baseline
        run: echo "This check validates the review and release hold. V1 runtime failures remain documented; no runtime pass is claimed."
