name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:mutations
      - run: npm --prefix labs/oauth ci
      - run: npm run test:oauth
      - run: npm audit --audit-level=high
      - run: npm --prefix labs/oauth audit --audit-level=high
      - run: npm run test:package
      - run: npm run test:container
      - run: npm sbom --omit=dev --sbom-format=cyclonedx > sbom.cdx.json
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-alpha-${{ github.sha }}
          path: |
            *.tgz
            sbom.cdx.json
          if-no-files-found: error
  attest:
    name: Attest verified artifacts
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: verified-alpha-${{ github.sha }}
          path: verified
      - name: Attest package build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: verified/*.tgz
          create-storage-record: false
      - name: Bind the production dependency inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: verified/*.tgz
          create-storage-record: false
          sbom-path: verified/sbom.cdx.json
