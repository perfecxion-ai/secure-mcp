name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:mutations
      - run: BENCH_SECONDS=1 npm run benchmark
      - run: BENCH_SECONDS=1 node --max-old-space-size=256 scripts/http-benchmark.mjs
      - run: npm run test:audit
      - run: npm --prefix labs/oauth ci
      - run: npm run test:oauth
      - run: npm audit --audit-level=high
      - run: npm --prefix labs/oauth audit --audit-level=high
      - run: npm run test:container
      - run: node labs/audit/storage-failure.mjs
      - run: npm run test:proxy
      - run: node scripts/production-sbom.mjs > sbom.cdx.json
      - name: Pack and test the exact candidate bytes
        run: |
          npm pack --ignore-scripts
          set -- *.tgz
          test "$#" -eq 1
          sha256sum "$1" > candidate.sha256
          node scripts/package-smoke.mjs --artifact "$1" --sbom sbom.cdx.json --evidence-directory consumer-evidence
          sha256sum --check candidate.sha256
      - name: Retain consumer evidence even when comparison fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-check-${{ github.sha }}
          path: |
            consumer-evidence/
            candidate.sha256
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-alpha-${{ github.sha }}
          path: |
            *.tgz
            sbom.cdx.json
          if-no-files-found: error
  attest:
    name: Attest verified artifacts
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-alpha-${{ github.sha }}
          path: verified
      - name: Attest package build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: verified/*.tgz
          create-storage-record: false
      - name: Bind the production dependency inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: verified/*.tgz
          create-storage-record: false
          sbom-path: verified/sbom.cdx.json
