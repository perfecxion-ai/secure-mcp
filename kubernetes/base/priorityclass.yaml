apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: high-priority
  labels:
    app.kubernetes.io/name: secure-mcp
    app.kubernetes.io/component: scheduling
value: 1000
globalDefault: false
description: "High priority class for production workloads"

---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: medium-priority
  labels:
    app.kubernetes.io/name: secure-mcp
    app.kubernetes.io/component: scheduling
value: 500
globalDefault: false
description: "Medium priority class for staging workloads"

---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: low-priority
  labels:
    app.kubernetes.io/name: secure-mcp
    app.kubernetes.io/component: scheduling
value: 100
globalDefault: false
description: "Low priority class for development workloads"
preemptionPolicy: PreemptLowerPriority